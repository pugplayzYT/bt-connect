name: Release APK and EXE
on:
  push:
    tags: ['v*', '!v*-preview*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test desktop/BtConnect.Core.Tests/BtConnect.Core.Tests.csproj -c Release -p:RestoreLockedMode=true
      - run: dotnet publish desktop/BtConnect.Server/BtConnect.Server.csproj -c Release -p:RestoreLockedMode=true -o artifacts/windows
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/windows/BtConnect.exe artifacts/release/BT-Connect-Windows-x64.exe
          Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/release/BT-Connect-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/release/*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept SDK licenses and install required packages
        run: bash scripts/prepare-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing and version
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name. Configure Android release signing before pushing a version tag."; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bt-connect-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bt-connect-release.jks" >> "$GITHUB_ENV"
          echo "BT_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "BT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test, lint, and build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p artifacts/release
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/release/BT-Connect-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/release/*
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bt-connect-release.jks"
  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release
      - name: Publish all artifacts together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release
          sha256sum BT-Connect-* > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes BT-Connect-* SHA256SUMS.txt
