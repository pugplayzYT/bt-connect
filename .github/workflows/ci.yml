name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test desktop/BtConnect.Core.Tests/BtConnect.Core.Tests.csproj -c Release -p:RestoreLockedMode=true
      - run: dotnet publish desktop/BtConnect.Server/BtConnect.Server.csproj -c Release -p:RestoreLockedMode=true -o artifacts/windows
      - uses: actions/upload-artifact@v4
        with:
          name: BT-Connect-Windows-x64
          path: artifacts/windows/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          accept-android-sdk-licenses: false
          packages: ''
      - name: Accept SDK licenses and install required packages
        run: bash scripts/prepare-android-sdk.sh
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: BT-Connect-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
