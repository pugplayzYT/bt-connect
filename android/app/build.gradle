plugins { id 'com.android.application' }

android {
    namespace 'dev.btconnect'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.btconnect'
        minSdk 26
        targetSdk 35
        versionCode = (System.getenv('BT_VERSION_CODE') ?: '1').toInteger()
        versionName = System.getenv('BT_VERSION_NAME') ?: '0.1.0'
    }
    // The release workflow supplies a persistent signing key through GitHub secrets.
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_PATH')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = false }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
